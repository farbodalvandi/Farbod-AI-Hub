{% extends "base.html" %}
{% block title %}Application Error{% endblock %}
{% block content %}
<div style="min-height:70vh;display:grid;place-items:center;padding:30px">
  <div class="card p-4" style="max-width:720px;width:100%;text-align:center">
    <div style="font-size:3rem;color:var(--accent)"><i class="bi bi-exclamation-triangle-fill"></i></div>
    <h2 class="mt-2">Internal Application Error</h2>
    <p class="text-muted">An error occurred while processing the request. Details were logged to:</p>
    <code style="display:block;direction:ltr;text-align:left;word-break:break-all">{{ log_path }}</code>
    <a class="btn btn-primary mt-3" href="{{ url_for('dashboard') if current_user else url_for('login') }}">Back</a>
  </div>
</div>
{% endblock %}
