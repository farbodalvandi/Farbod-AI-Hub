{% extends "base.html" %}
{% block title %}Lookup Management{% endblock %}
{% block content %}
<h4 class="mb-3"><i class="bi bi-list-check"></i> Lookup Value Management</h4>
<div class="row g-3">
  {% for key, values in data.items() %}
  <div class="col-md-4">
    <div class="card shadow-sm h-100">
      <div class="card-header fw-bold">{{ key }}</div>
      <ul class="list-group list-group-flush">
        {% for v in values %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
          <form method="post" action="{{ url_for('lookup_rename', lookup_id=v['id']) }}" class="d-flex flex-grow-1 me-2">
            <input type="text" name="value" value="{{ v['value'] }}" class="form-control form-control-sm">
            <button class="btn btn-sm btn-outline-secondary ms-1" title="Save"><i class="bi bi-check2"></i></button>
          </form>
          <form method="post" action="{{ url_for('lookup_delete', lookup_id=v['id']) }}" onsubmit="return confirm('Delete this item?')">
            <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
          </form>
        </li>
        {% endfor %}
      </ul>
      <div class="card-body">
        <form method="post" action="{{ url_for('lookup_add', field_key=key) }}" class="d-flex">
          <input type="text" name="value" class="form-control form-control-sm" placeholder="New value" required>
          <button class="btn btn-sm btn-primary ms-1"><i class="bi bi-plus"></i></button>
        </form>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
