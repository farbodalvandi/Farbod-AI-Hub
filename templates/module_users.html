<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{module.title}} Users</title><link rel="stylesheet" href="{{url_for('static',filename='hub.css')}}"><link rel="stylesheet" href="{{url_for('static',filename='vendor/css/bootstrap-icons.css')}}"><style>.users-wrap{max-width:1100px;margin:40px auto;padding:24px}.panel{background:rgba(10,18,32,.9);border:1px solid #29415f;border-radius:18px;padding:22px;margin-bottom:20px;color:#fff}.row{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:center;margin:10px 0}input{width:100%;padding:11px;border-radius:10px;border:1px solid #52657e;background:#111d2d;color:#fff}button{padding:10px 16px;border:0;border-radius:10px;cursor:pointer}.danger{background:#8b3030;color:#fff}.ok{background:#2d6a4f;color:#fff}.muted{opacity:.7}</style></head><body class="placeholder-page"><div class="users-wrap"><a href="{{url_for('hardware_hub')}}">← Farbod AI-Hub</a><h1>{{module.title}} — User Management</h1>{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="panel">{{m}}</div>{% endfor %}{% endwith %}<div class="panel"><h2><i class="bi bi-person-plus"></i> Create User</h2><form method="post"><input type="hidden" name="action" value="create"><div class="row"><input name="username" placeholder="Username" required><input type="password" name="password" placeholder="Password (6+ characters)" required><button class="ok">Create</button></div></form></div><div class="panel"><h2>Users</h2>{% for u in users %}<form method="post" class="row"><input type="hidden" name="action" value="update"><input type="hidden" name="user_id" value="{{u.id}}"><input name="username" value="{{u.username}}" required><input type="password" name="password" placeholder="New password (leave blank to keep)"><label><input type="checkbox" name="active" {% if u.active %}checked{% endif %}> Active</label><button class="ok">Save</button></form><form method="post" style="margin-bottom:18px"><input type="hidden" name="action" value="delete"><input type="hidden" name="user_id" value="{{u.id}}"><button class="danger">Delete {{u.username}}</button></form>{% endfor %}</div><div class="panel"><h2><i class="bi bi-key"></i> Change My Password</h2><p class="muted">Signed in as {{current}}</p><form method="post" action="{{url_for('module_change_password',module_key=module_key)}}"><div class="row"><input type="password" name="new_password" placeholder="New password" required><input type="password" name="confirm_password" placeholder="Confirm password" required><button class="ok">Change Password</button></div></form></div></div></body></html>
